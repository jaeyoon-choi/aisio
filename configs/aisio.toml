[os]
distro = "ubuntu"
version = "resolute"

[xnvme.repository]
remote = "https://github.com/xnvme/xnvme"
branch = "main"
path = "/root/git/xnvme"

[upcie.dkms]
remote = "https://github.com/safl/upcie"
release = "v0.9.0"

# Both experimental modules, 'dmabuf_import' and 'iommu_map_pa', ship as a
# single DKMS package whose version tracks the uPCIe release above. Earlier
# releases published them as two packages versioned independently of uPCIe.
[upcie.dkms.package]
name = "upcie-experimental-dkms"
version = "0.9.0"

[xal.repository]
remote = "https://github.com/xnvme/xal"
tag = "v0.3.2"
path = "/root/git/xal"

[fil.repository]
remote = "https://github.com/xnvme/fil"
tag = "v0.3.3"
path = "/root/git/fil"

[spdk.repository]
remote = "https://github.com/spdk/spdk"
tag = "v26.01"
path = "/root/git/spdk"

[fio.repository]
remote = "https://github.com/axboe/fio"
tag = "fio-3.41"
path = "/root/git/fio"
