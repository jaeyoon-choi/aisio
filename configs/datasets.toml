# nvme0 on sid, NUMA node 0, the same node as the L4 GPU at 0000:31:00.0. The
# IOMMU overhead benchmark unmounts this mountpoint before it takes the device
# into userspace, and uses pci_addr only when no [[devices]] list is given.
[filesystems.dset]
mountpoint = "/mnt/datasets"
name = "xfs"
bdev = "/dev/nvme0n1"
pci_addr = "0000:4d:00.0"

[datasets.tiktokish]
seed = "tiktokish"
path = "/mnt/datasets/tiktokish"
nclasses = 32
nfiles_min = 14
nfiles_max = 14
filesize_min = 7340032
filesize_max = 8388608

[datasets.filesize8gib]
seed = "filesize8gib"
path = "/mnt/datasets/filesize8gib"
nclasses = 2
nfiles_min = 10
nfiles_max = 10
filesize_min = 8589934592
filesize_max = 8589934592

[datasets.imagenetish]
seed = "imagenetish"
path = "/mnt/datasets/imagenetish"
nclasses = 1000
nfiles_min = 1000
nfiles_max = 1400
filesize_min = 75000
filesize_max = 150000
