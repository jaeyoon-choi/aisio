doc: |
  Dump the IOMMU mapping granularity of a CUDA dma-buf
  ====================================================

  The IOMMU-overhead benchmark showed no delta for GPU-memory buffers because
  the GPU heap is mapped through ``iommu_map_pa_add`` at
  ``DMAMEM_CUDA_REGISTRY_GRANULARITY`` = 2 MiB, one bulk mapping at bring-up,
  and not mapped at all with iommu-off (uio), which drives raw BAR2 physical
  addresses. This probe dumps the ``(dma_addr, dma_len)`` tuples GET_MAP
  returns for one large CUDA buffer, to tell the export-side segmentation
  apart from that mapping.

  The misc import enumerates the exporter's pages (64 KiB, raw BAR2 physical);
  importing on behalf of a real NVMe (``--bdf``) shows NVIDIA's private map
  path merging them into one 1 GiB segment. Neither tuple size is the
  benchmark's IOMMU mapping unit (2 MiB).

  It also prints the CUDA allocation granularity and DMABUF_IMPORT_DESCRIBE,
  which says where the buffer ended up (device memory vs migrated to system
  memory), so a silently-migrated buffer cannot be misread as device memory.

  Requirements
  ------------
  The target needs the DMABUF_IMPORT UAPI and module: run
  `tasks/setup_upcie_modules.yaml` first, and CUDA on the PATH (the transport
  config already adds it).

  Tuning
  ------
  The step takes `size_mib` (CUDA buffer size, default 1024), `gpu_id` (default
  0), and `bdf`. The default import (no `bdf`) attaches as uPCIe's own misc
  device, the enumeration step the upcie-cuda backend also performs; its actual
  2 MiB ``iommu_map_pa_add`` mapping is not exercised here. Set `bdf` to an
  NVMe PCI address to instead import on behalf of that device, the
  peer-to-peer path the addresses are programmed into.

  Example:

    cijoe --monitor \
      -c configs/transport.toml \
      tasks/probe_dmabuf_import.yaml

  Recovery
  --------
  If a later run fails to open the device with -ENOMEM or -ESTALE, the module
  may hold a leaked import from an earlier one-shot tool; confirm with
  `dmesg | grep dmabuf_import` and recover with
  `rmmod dmabuf_import && modprobe dmabuf_import`. This probe uses
  ATTACH_BDF (even for the misc-device case), so its own imports are released
  when the descriptor closes and it does not leak on exit.

steps:
- name: probe
  uses: dmabuf_import_probe
  with:
    size_mib: 1024
    gpu_id: 0
    # bdf: "0000:41:00.0"
